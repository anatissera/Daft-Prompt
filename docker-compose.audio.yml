# Opt-in local audio analysis. This installs the heavy Demucs/Torch/MIR stack
# and makes the upload affordance available in the chat UI.
services:
  api:
    build:
      args:
        # Keep the standard Vertex adapter when this override replaces the
        # Dockerfile's default build argument, so audio and Vertex compose.
        RUNTIME_EXTRAS: "audio-analysis vertexai"
        INSTALL_AUDIO_SYSTEM_DEPS: "true"
    environment:
      ENABLE_AUDIO_ANALYSIS: "true"
  web:
    environment:
      NEXT_PUBLIC_ENABLE_LOCAL_AUDIO_ANALYSIS: "true"
