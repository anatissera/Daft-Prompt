[project]
name = "llm-band"
version = "0.1.0"
description = "Multi-agent LLM music composition system — backend (Phase 1: walking skeleton)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pretty_midi>=0.2.10",
    "music21>=9.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["llm_band*"]
