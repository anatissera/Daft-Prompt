[project]
name = "music-assistant"
version = "0.1.0"
description = "Multi-agent LLM music composition system — backend (Phase 1: walking skeleton)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pretty_midi>=0.2.10",
    "music21>=9.1",
    "langgraph>=0.2,<0.4",
    "langsmith>=0.1",
    "langchain-google-genai>=2.0,<3.0",
    # OpenRouter is the default configured fallback for Gemini, so its adapter
    # belongs in the standard runtime instead of failing only when needed.
    "langchain-openai>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
transcription = ["basic-pitch>=0.4"]
audio-analysis = [
    "librosa>=0.10",
    "soundfile>=0.12",
    "demucs>=4.0",
    "torch>=2.5,<2.6",
    "torchaudio>=2.5,<2.6",
]
# Provider-agnostic by design (see music_assistant/llm.py). Gemini and the
# default OpenRouter fallback are standard; install these adapters only when
# selecting them at runtime via LLM_PROVIDER.
gemini = []
groq = ["langchain-groq>=0.2"]
vertexai = ["langchain-google-vertexai>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["music_assistant*"]
