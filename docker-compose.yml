services:
  api:
    build:
      context: ./apps/api
    environment:
      LLM_PROVIDER: vertexai
      GOOGLE_CLOUD_PROJECT: daft-promt
      GOOGLE_CLOUD_LOCATION: global
      MODEL_DIRECTOR: gemini-3.5-flash
      MODEL_INSTRUMENT: gemini-3.5-flash
      MODEL_ARBITER: gemini-3.5-flash
      ENABLE_WEB_RESEARCH: "true"
      REFERENCE_STEM_CACHE_ENABLED: "true"
      GOOGLE_APPLICATION_CREDENTIALS: /run/gcloud/application_default_credentials.json
    ports:
      - "8000:8000"
    volumes:
      - ${HOME}/.config/gcloud/application_default_credentials.json:/run/gcloud/application_default_credentials.json:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build:
      context: ./apps/web
    environment:
      API_BASE_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
