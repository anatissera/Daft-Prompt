services:
  api:
    build:
      context: ./apps/api
    environment:
      # Leave provider settings unset for a self-contained canned-composition
      # runtime. Supply these through a local .env file when using an LLM.
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      ENABLE_WEB_RESEARCH: ${ENABLE_WEB_RESEARCH:-false}
      REFERENCE_STEM_CACHE_ENABLED: ${REFERENCE_STEM_CACHE_ENABLED:-false}
      REFERENCE_UPLOAD_DIR: /app/uploads
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/uploads:/app/uploads
      - ./apps/api/outputs:/app/outputs
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build:
      context: ./apps/web
    environment:
      API_BASE_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
