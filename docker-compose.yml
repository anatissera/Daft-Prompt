services:
  api:
    build:
      context: ./apps/api
    ports:
      - "8000:8000"
    environment:
      REFERENCE_STEM_CACHE_ENABLED: "true"
    volumes:
      - ./apps/api/outputs:/app/outputs
      - ./apps/api/uploads:/app/uploads

  web:
    build:
      context: ./apps/web
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  web_node_modules:
